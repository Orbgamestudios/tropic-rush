<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game use the full screen around the notch / Dynamic Island. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tropic Rush" />
    <meta name="format-detection" content="telephone=no" />
    <title>Tropic Rush</title>
    <!--
      The loading screen (src/game/ui/loadingScreen.ts) is styled here, in the page, so it's up in
      the game's navy and brass from the first moment, before any of the game's code or styles.
    -->
    <style>
      @font-face {
        font-family: "Randoshape";
        src:
          url("/fonts/Randoshape.woff") format("woff"),
          url("/fonts/Randoshape.ttf") format("truetype");
        font-weight: 100 1000;
        font-display: swap;
      }
      html,
      body {
        background: #070e1b;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          repeating-linear-gradient(120deg, rgb(220 174 90 / 0.07) 0 3px, transparent 3px 30px),
          radial-gradient(ellipse at 50% 42%, #2d548f 0%, #1b2f50 38%, #0d182b 72%, #070e1b 100%);
        font-family: "Randoshape", "Lilita One", "Trebuchet MS", system-ui, sans-serif;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.3s ease,
          visibility 0s linear 0s;
        user-select: none;
        -webkit-user-select: none;
      }
      #loading.gone {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          visibility 0s linear 0.3s;
      }
      .loading-middle {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: min(56vw, 440px);
      }
      .loading-title {
        font-size: clamp(34px, 9vh, 68px);
        line-height: 1;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
        color: transparent;
        background: linear-gradient(180deg, #fff0b8 0%, #ffd56a 46%, #e3a53c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(1.4px 0 0 #0a1222) drop-shadow(-1.4px 0 0 #0a1222)
          drop-shadow(0 1.4px 0 #0a1222) drop-shadow(0 -1.4px 0 #0a1222)
          drop-shadow(0 3px 0 #0a1222);
      }
      .loading-bar {
        position: relative;
        width: 100%;
        height: 14px;
        padding: 2px;
        box-sizing: border-box;
        border-radius: 3px;
        background: #0d182b;
        box-shadow:
          0 0 0 2px #dcae5a,
          0 0 0 3px #6f4c1d,
          0 3px 0 3px #0a1222,
          inset 0 2px 4px rgb(0 0 0 / 0.6);
        overflow: hidden;
      }
      .loading-fill {
        position: relative;
        height: 100%;
        width: 8%;
        border-radius: 2px;
        background: linear-gradient(180deg, #fff0b8 0%, #ffd56a 40%, #e3a53c 75%, #b8731c 100%);
        transition: width 0.35s ease;
        overflow: hidden;
      }
      .loading-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 0%,
          rgb(255 255 255 / 0.55) 45%,
          transparent 60%
        );
        transform: translateX(-100%);
        animation: loading-sheen 1.4s ease-in-out infinite;
      }
      @keyframes loading-sheen {
        to {
          transform: translateX(260%);
        }
      }
      .loading-note {
        min-height: 1em;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #f4ead2;
        opacity: 0.85;
        text-shadow: 0 1.5px 0 #0a1222;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="loading-middle">
        <div class="loading-title">Tropic Rush</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <div class="loading-note">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
