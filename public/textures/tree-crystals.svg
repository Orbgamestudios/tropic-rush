<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <!-- Crystal clusters behind the upgrade tree, one in each crystal's colour. It tiles sideways. -->
  <title>Crystal clusters</title>
  <defs>
    <path id="shard" d="M0-70 22-38 22 44 0 70-22 44-22-38Z M0-70V70 M-22-38 0-22 22-38 M-22 44 0 28 22 44" />
    <g id="cluster">
      <use href="#shard" />
      <use href="#shard" transform="translate(36 22) rotate(26) scale(0.62)" />
      <use href="#shard" transform="translate(-34 26) rotate(-30) scale(0.5)" />
      <use href="#shard" transform="translate(12 50) rotate(70) scale(0.34)" />
    </g>
  </defs>
  <g fill-opacity="0.07" stroke-opacity="0.26" stroke-width="1.6" stroke-linejoin="round">
    <use href="#cluster" transform="translate(110 300) rotate(-14)" fill="#7ee070" stroke="#a6f39a" />
    <use href="#cluster" transform="translate(360 120) rotate(10) scale(0.8)" fill="#ff9a5c" stroke="#ffbf92" />
    <use href="#cluster" transform="translate(610 320) rotate(-6) scale(1.1)" fill="#8fdcff" stroke="#bdeeff" />
    <use href="#cluster" transform="translate(850 110) rotate(18) scale(0.75)" fill="#c79bff" stroke="#e0c6ff" />
  </g>
</svg>
